name: Daily Gold Briefing

on:
  repository_dispatch:
    types: [generate_briefing]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate briefing + chart + posts
        run: python scripts/generate_briefing.py

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-briefing.json
          if [ -f chart.png ]; then git add chart.png; fi
          git commit -m "Auto-update daily briefing" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true
