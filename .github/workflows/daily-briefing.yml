name: Daily Gold Briefing

on:
  schedule:
    - cron: '0 12 * * *' # Runs at 12:00 UTC (8:00 AM EST)
  workflow_dispatch: # Allows manual runs

permissions:
  contents: write # <--- THIS FIXES THE 403 PERMISSION ERROR

jobs:
  update-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests

      - name: Generate Briefing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add daily-briefing.json
          git commit -m "Auto-update daily briefing" || echo "No changes to commit"
          git push
