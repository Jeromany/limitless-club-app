name: 3x Daily Pulse

on:
  schedule:
    # 8:00 AM AST (12:00 UTC)
    - cron: "0 12 * * 1-5"
    # 1:00 PM AST (17:00 UTC)
    - cron: "0 17 * * 1-5"
    # 6:00 PM AST (22:00 UTC)
    - cron: "0 22 * * 1-5"
  repository_dispatch:
    types: [generate_briefing]
  workflow_dispatch:
    inputs:
      session:
        description: 'Which pulse to run?'
        required: true
        default: 'morning'
        type: choice
        options:
          - morning
          - midday
          - wrap

permissions:
  contents: write

jobs:
  run-pulse:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine Session
        id: get_session
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "SESSION=${{ inputs.session }}" >> $GITHUB_ENV
          else
            HOUR=$(date -u +%H)
            if [ "$HOUR" == "12" ]; then
              echo "SESSION=morning" >> $GITHUB_ENV
            elif [ "$HOUR" == "17" ]; then
              echo "SESSION=midday" >> $GITHUB_ENV
            elif [ "$HOUR" == "22" ]; then
              echo "SESSION=wrap" >> $GITHUB_ENV
            else
              echo "SESSION=morning" >> $GITHUB_ENV
            fi
          fi

      - name: Run Briefing
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_BOT_TOKEN_PROD: ${{ secrets.TELEGRAM_BOT_TOKEN_PROD }}
          TELEGRAM_CHAT_ID_PROD: ${{ secrets.TELEGRAM_CHAT_ID_PROD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_WEBHOOK_PROD: ${{ secrets.DISCORD_WEBHOOK_PROD }}
        run: python scripts/generate_briefing.py --session ${{ env.SESSION }}

      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add daily-briefing.json briefing.json
          if [ -f chart.png ]; then git add chart.png; fi
          if [ -f chart.jpg ]; then git add chart.jpg; fi
          git commit -m "Auto-update pulse: ${{ env.SESSION }}" || echo "Nothing to commit"
          git push || echo "Push skipped"

      - name: Post to Make (Facebook)
        env:
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: |
          if [ -f briefing.json ]; then
            PRICE=$(jq -r '.price' briefing.json)
            CHANGE=$(jq -r '.change' briefing.json)

            # Capitalize the first letter of the session (Morning, Midday, Wrap)
            SESSION_CAP=$(echo $SESSION | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')

            CAPTION="XAU/USD $SESSION_CAP Pulse | \$$PRICE ($CHANGE) | Full institutional analysis and structural levels live at the Limitless Journeys desk. #XAUUSD #GoldTrading #LimitlessJourneys"
            CHART_URL="https://raw.githubusercontent.com/jeromany/limitless-club-app/main/chart.jpg"

            # Build the JSON payload safely using jq
            jq -n --arg cap "$CAPTION" --arg url "$CHART_URL" '{caption: $cap, chartImageUrl: $url}' > payload.json

            # Fire the webhook
            curl -s -X POST -H "Content-Type: application/json" -d @payload.json "$MAKE_WEBHOOK_URL"
          fi
